name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fu
          POSTGRES_PASSWORD: fu
          POSTGRES_DB: fu_session_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fu -d fu_session_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        # Prisma itself supports Node 20.19. A nested helper, @prisma/streams-local,
        # is only used by Prisma's local database tool, which this app does not run,
        # and that helper declares Node 22. .npmrc sets engine-strict=true, and
        # --ignore-engines does not override that file. Turn the check off for
        # this install only, keep Node 20.19, and then run lint, build, and tests.
        run: npm ci --engine-strict=false

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
