<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FireUltimate — Command Calendar (November 2026)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas: #edf2f8;
      --text: #0f172a;
      --muted: #64748b;
      --border: #dbe2ec;
      --chip-border: #cbd5e1;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --sidebar-w: 268px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--canvas);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      min-height: 100vh;
      background: var(--canvas);
    }

    .sidebar {
      background:
        radial-gradient(circle at top, #1e293b 0%, #0f172a 52%),
        #0f172a;
      color: #cbd5e1;
      padding: 0.95rem 0.8rem 1rem;
      border-right: 1px solid #1f2937;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.75rem;
      border: 1px solid #334155;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.64);
      margin-bottom: 0.95rem;
    }
    .sidebar-logo {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: rgba(30, 64, 175, 0.32);
      color: #93c5fd;
      font-size: 0.72rem;
      font-weight: 800;
    }
    .sidebar-brand strong { display: block; color: #f8fafc; font-size: 0.84rem; }
    .sidebar-brand span { color: #94a3b8; font-size: 0.72rem; }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.58rem 0.72rem;
      border-radius: 10px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      margin-bottom: 0.22rem;
    }
    .nav-link.active { background: rgba(37, 99, 235, 0.38); color: #fff; }
    .nav-dot { width: 7px; height: 7px; border-radius: 99px; background: #64748b; }
    .nav-link.active .nav-dot { background: #93c5fd; }

    .main-shell { min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: 52px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.1rem;
    }
    .breadcrumb { color: var(--muted); font-size: 0.82rem; font-weight: 600; }
    .breadcrumb em { font-style: normal; color: var(--text); }
    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.28rem 0.65rem 0.28rem 0.28rem;
      background: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      color: #334155;
    }
    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 99px;
      background: #1e293b;
      color: #e2e8f0;
      display: grid;
      place-items: center;
      font-size: 0.65rem;
      font-weight: 700;
    }

    .page-content { padding: 1rem 1.1rem 1.4rem; }
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }
    .page-header h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 750;
      letter-spacing: -0.02em;
    }
    .header-trail { display: grid; justify-items: end; gap: 0.28rem; }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .last-action { margin: 0; color: var(--muted); font-size: 0.72rem; font-weight: 600; }

    .month-nav {
      display: inline-flex;
      align-items: center;
      gap: 0.15rem;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.18rem;
    }
    .month-nav button {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #334155;
      font-weight: 700;
    }
    .cal-toggle {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: var(--blue-soft);
      color: var(--blue);
      display: grid;
      place-items: center;
    }
    .month-label { min-width: 118px; text-align: center; font-size: 0.84rem; font-weight: 700; }

    .view-switch {
      display: inline-flex;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.18rem;
      gap: 0.12rem;
    }
    .view-switch span {
      padding: 0.32rem 0.55rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #475569;
    }
    .view-switch span.on { background: var(--blue); color: #fff; }

    .shift-select, .person-select {
      height: 34px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 0 0.55rem;
      background: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
    }
    .btn {
      height: 34px;
      border-radius: 10px;
      padding: 0 0.7rem;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid #c6d0dd;
      background: #fff;
      color: var(--text);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.72rem;
      margin: 0.75rem 0 0.9rem;
    }
    .stat-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.78rem 0.85rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      min-height: 76px;
    }
    .stat-card p { margin: 0; color: var(--muted); font-size: 0.77rem; font-weight: 600; }
    .stat-card strong { display: block; margin-top: 0.28rem; font-size: 1.28rem; letter-spacing: -0.02em; }
    .tone {
      display: inline-flex;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 750;
      padding: 0.2rem 0.48rem;
    }
    .tone-warning { background: #fef3c7; color: #92400e; }
    .tone-critical { background: #fee2e2; color: #991b1b; }
    .stat-open strong { color: #991b1b; }
    .stat-coverage strong, .stat-override strong { color: #a16207; }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
    }
    .cal { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
    .cal th {
      background: #f8fafc;
      border-bottom: 1px solid #e8eef5;
      border-right: 1px solid #e8eef5;
      padding: 0.55rem 0.35rem;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #475569;
      text-align: center;
    }
    .cal th:last-child { border-right: 0; }
    .cal td {
      border-right: 1px solid #e8eef5;
      border-bottom: 1px solid #e8eef5;
      vertical-align: top;
      padding: 0.38rem 0.38rem 0.45rem;
      height: 168px;
    }
    .cal td:last-child { border-right: 0; }
    .cal tr:last-child td { border-bottom: 0; }

    .day-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.35rem;
      height: 1.35rem;
      margin-bottom: 0.28rem;
      font-size: 0.78rem;
      font-weight: 800;
    }
    .day-num.today {
      border: 1.5px solid var(--blue);
      background: var(--blue-soft);
      color: var(--blue);
      border-radius: 8px;
      padding: 0 0.28rem;
    }

    td.outside, td.off { background: #f8fafc; }
    td.outside .day-num, td.off .day-num { color: #94a3b8; font-weight: 700; }
    td.today-col { background: rgba(239, 246, 255, 0.7); }
    td.open-day { background: #fef2f2; box-shadow: inset 3px 0 0 #dc2626; }
    td.selected { box-shadow: inset 0 0 0 3px #2563eb; }

    .rig {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 0.12rem 0.28rem;
      align-items: center;
      margin-bottom: 0.18rem;
    }
    .unit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.08rem;
      height: 18px;
      border-radius: 6px;
      font-size: 0.62rem;
      font-weight: 800;
    }
    .unit svg { display: block; }
    .unit-engine { background: #dbeafe; color: #1e3a8a; }
    .unit-tower { background: #fee2e2; color: #991b1b; }
    .unit-medic { background: #f8fafc; color: #0f172a; border: 1px solid #cbd5e1; }
    .seats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.14rem; min-width: 0; }
    .pill {
      display: block;
      border-radius: 999px;
      padding: 0.08rem 0.28rem;
      font-size: 0.62rem;
      font-weight: 700;
      line-height: 1.25;
      background: #fff;
      border: 1px solid #e2e8f0;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pill.open { background: #fee2e2; border-color: #fecaca; color: #991b1b; }
    .pill.hot { background: #fef9c3; border-color: #facc15; }
    .note {
      display: block;
      margin-top: 0.18rem;
      border-radius: 999px;
      padding: 0.08rem 0.4rem;
      font-size: 0.58rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .note.info { background: #e2e8f0; color: #0f172a; }
    .note.trades { background: #ede9fe; color: #5b21b6; }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo">FU</div>
        <div>
          <strong>FireUltimate</strong>
          <span>Operations</span>
        </div>
      </div>
      <a class="nav-link" href="#"><span class="nav-dot"></span>Dashboard</a>
      <a class="nav-link active" href="#"><span class="nav-dot"></span>Personnel</a>
      <a class="nav-link" href="#"><span class="nav-dot"></span>Apparatus</a>
    </aside>

    <div class="main-shell">
      <div class="topbar">
        <div class="breadcrumb">Personnel / <em>Schedule</em></div>
        <div class="user-pill"><span class="avatar">JW</span>Ops Admin</div>
      </div>

      <div class="page-content">
        <header class="page-header">
          <h1>Personnel Schedule</h1>
          <div class="header-trail">
            <div class="header-actions">
              <div class="month-nav">
                <button type="button" aria-label="Previous month">&lt;</button>
                <button type="button" class="cal-toggle" aria-label="Command calendar" title="Command calendar">
                  <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                    <rect x="2" y="3" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
                    <path d="M5 2v2M11 2v2M2 7h12" stroke="currentColor" stroke-width="1.5"></path>
                    <circle cx="5.5" cy="10" r="0.8" fill="currentColor"></circle>
                    <circle cx="8" cy="10" r="0.8" fill="currentColor"></circle>
                    <circle cx="10.5" cy="10" r="0.8" fill="currentColor"></circle>
                  </svg>
                </button>
                <div class="month-label">November 2026</div>
                <button type="button" aria-label="Next month">&gt;</button>
              </div>
              <div class="view-switch" aria-label="Schedule view">
                <span>Week</span>
                <span>Month</span>
                <span class="on">Command</span>
              </div>
              <select class="shift-select" aria-label="Shift"><option>Weekday 12-Hour</option></select>
              <select class="person-select" aria-label="Highlight Personnel"><option>Highlight: Leduc</option></select>
              <button class="btn" type="button">X</button>
              <button class="btn" type="button">Undo</button>
            </div>
            <p class="last-action">Last action: Viewing command calendar</p>
          </div>
        </header>

        <section class="stat-grid" aria-label="Schedule summary">
          <article class="stat-card stat-open">
            <div><p>Open Seats</p><strong>1</strong></div>
            <span class="tone tone-critical">Open</span>
          </article>
          <article class="stat-card stat-coverage">
            <div><p>Coverage</p><strong>99%</strong></div>
            <span class="tone tone-warning">Watch</span>
          </article>
          <article class="stat-card stat-override">
            <div><p>Pending Overrides</p><strong>1</strong></div>
            <span class="tone tone-warning">Review</span>
          </article>
        </section>

        <section class="panel" aria-label="November 2026 command calendar">
          <table class="cal">
            <thead>
              <tr>
                <th>SUN</th><th>MON</th><th>TUE</th><th>WED</th><th>THU</th><th>FRI</th><th>SAT</th>
              </tr>
            </thead>
            <tbody id="cal-body"></tbody>
          </table>
        </section>
      </div>
    </div>
  </div>

  <script>
    var engineIcon = '<svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><rect x="1" y="6" width="10" height="5" rx="1" fill="#dc2626"/><rect x="7" y="3.5" width="4" height="2.6" rx="0.4" fill="#b91c1c"/><circle cx="4" cy="12" r="1.2" fill="#1e293b"/><circle cx="10" cy="12" r="1.2" fill="#1e293b"/></svg>';
    var towerIcon = '<svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><path fill="#991b1b" d="M8 1.2 9.1 4.2 12.2 4.4 9.8 6.4 10.6 9.5 8 7.8 5.4 9.5 6.2 6.4 3.8 4.4 6.9 4.2Z"/></svg>';
    var medicIcon = '<svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><rect x="6.4" y="1.5" width="3.2" height="13" rx="0.4" fill="#1d4ed8"/><rect x="1.5" y="6.4" width="13" height="3.2" rx="0.4" fill="#1d4ed8"/></svg>';
    var units = [
      { code: "E4", cls: "unit-engine", icon: engineIcon },
      { code: "E5", cls: "unit-engine", icon: engineIcon },
      { code: "T1", cls: "unit-tower", icon: towerIcon },
      { code: "A1", cls: "unit-medic", icon: medicIcon }
    ];
    var crewA = [["Wichtner", "Leduc"], ["Wolf", "Johnson"], ["Harnish", "Allen"], ["Smith", "Brooks"]];
    var crewB = [["Hale", "Brooks"], ["Wichtner", "Leduc"], ["Wolf", "Smith"], ["Johnson", "Allen"]];
    var notes = {
      "2026-11-05": { kind: "info", text: "Info · Chief on call Hale" },
      "2026-11-06": { kind: "trades", text: "Trade · Leduc / Brooks 08:00–12:00" },
      "2026-11-26": { kind: "info", text: "Info · Thanksgiving staffing" }
    };

    function pad(n) { return n < 10 ? "0" + n : String(n); }
    function keyOf(y, m, d) { return y + "-" + pad(m) + "-" + pad(d); }
    function pill(name) {
      if (!name) return '<span class="pill open">Open</span>';
      return '<span class="pill' + (name === "Leduc" ? " hot" : "") + '">' + name + "</span>";
    }
    function rosterHtml(seats) {
      var html = "";
      for (var i = 0; i < units.length; i++) {
        html += '<div class="rig"><span class="unit ' + units[i].cls + '">' + units[i].icon + units[i].code + '</span><div class="seats">' + pill(seats[i][0]) + pill(seats[i][1]) + "</div></div>";
      }
      return html;
    }

    var cells = [];
    var cursor = new Date(2026, 10, 1);
    cursor.setDate(cursor.getDate() - cursor.getDay());
    for (var n = 0; n < 35; n++) {
      var y = cursor.getFullYear();
      var m = cursor.getMonth() + 1;
      var d = cursor.getDate();
      var inMonth = y === 2026 && m === 11;
      var weekday = cursor.getDay() !== 0 && cursor.getDay() !== 6;
      var id = keyOf(y, m, d);
      var cls = [];
      var body = "";
      if (!inMonth) cls.push("outside");
      else if (!weekday) cls.push("off");
      else {
        var seats = (Math.floor((d - 1) / 7) % 2 === 0 ? crewA : crewB).map(function (pair) { return pair.slice(); });
        if (id === "2026-11-04") seats[1][1] = "";
        if (id === "2026-11-05") cls.push("today-col");
        if (id === "2026-11-04") cls.push("open-day");
        if (id === "2026-11-06") cls.push("selected");
        body = rosterHtml(seats);
        if (notes[id]) body += '<span class="note ' + notes[id].kind + '">' + notes[id].text + "</span>";
      }
      cells.push('<td class="' + cls.join(" ") + '"><div class="day-num' + (id === "2026-11-05" ? " today" : "") + '">' + d + "</div>" + body + "</td>");
      cursor.setDate(cursor.getDate() + 1);
    }
    var rows = "";
    for (var r = 0; r < cells.length; r += 7) rows += "<tr>" + cells.slice(r, r + 7).join("") + "</tr>";
    document.getElementById("cal-body").innerHTML = rows;
  </script>
</body>
</html>
